  // --- 効果音を作るプログラム（外部の音声ファイル不要） ---
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 正解音「ピンポーン♪」
  function playCorrectSound() {
    initAudio();
    const now = audioCtx.currentTime;

    // 1音目「ピン」（高いミ：659.25Hz）
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(659.25, now);
    gain1.gain.setValueAtTime(0.3, now);
    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.3);

    // 2音目「ポーン」（高いド：523.25Hz）
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(523.25, now + 0.18);
    gain2.gain.setValueAtTime(0.3, now + 0.18);
    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now + 0.18);
    osc2.stop(now + 0.8);
  }

  // 不正解音「ブブー」

    initAudio();

    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sawtooth'; // ブザーらしい音色
    osc1.frequency.setValueAtTime(140, now);
    gain1.gain.setValueAtTime(0.2, now);
    gain1.gain.linearRampToValueAtTime(0.01, now + 0.15);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.15);

    // 2回目「ブー」（低い音：140Hz）

    osc2.type = 'sawtooth';

    gain2.gain.setValueAtTime(0.2, now + 0.22);
    gain2.gain.linearRampToValueAtTime(0.01, now + 0.55);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now + 0.22);
    osc2.stop(now + 0.55);
  }

      answer: 1,
      explanation: "正解は「2. マッシュ（M*A*S*H）」です。シニカルな笑いと独特のテンポで話題を呼び、昭和40年代後半の映画界に新鮮な風を吹かせました。"
    }



  ];

  let currentQuestionIndex = 0;
  let score = 0;

  const progressText = document.getElementById("progress-text");
  const questionText = document.getElementById("question-text");
  const choicesContainer = document.getElementById("choices-container");
  const resultArea = document.getElementById("result-area");
  const judgeMark = document.getElementById("judge-mark");
  const explanationText = document.getElementById("explanation-text");
  const nextBtn = document.getElementById("next-btn");
  const quizArea = document.getElementById("quiz-area");
  const finalArea = document.getElementById("final-area");
  const scoreText = document.getElementById("score-text");

  // 問題の表示
  function loadQuestion() {
    resultArea.style.display = "none";
    choicesContainer.innerHTML = "";

    const currentQuiz = quizData[currentQuestionIndex];
    progressText.textContent = `第 ${currentQuestionIndex + 1} 問 / 全 ${quizData.length} 問`;
    questionText.textContent = currentQuiz.question;

    currentQuiz.choices.forEach((choice, index) => {
      const button = document.createElement("button");
      button.textContent = choice;
      button.className = "choice-btn";
      button.onclick = () => selectAnswer(index);
      choicesContainer.appendChild(button);
    });
  }

  // 答えを選んだときの処理
  function selectAnswer(selectedIndex) {
    const currentQuiz = quizData[currentQuestionIndex];
    const buttons = choicesContainer.querySelectorAll(".choice-btn");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === currentQuiz.answer) {
        btn.style.backgroundColor = "#fed7d7";
        btn.style.borderColor = "#e53e3e";
      }
    });

    resultArea.className = "result-area";
    if (selectedIndex === currentQuiz.answer) {
      playCorrectSound(); // 正解音を鳴らす
      score++;
      judgeMark.textContent = "〇 大正解！";
      judgeMark.className = "judge-mark mark-correct";
      resultArea.classList.add("result-correct");
    } else {
      playWrongSound(); // 不正解音を鳴らす
      judgeMark.textContent = "? 残念！";
      judgeMark.className = "judge-mark mark-wrong";
      resultArea.classList.add("result-wrong");
    }

    explanationText.textContent = currentQuiz.explanation;
    resultArea.style.display = "block";

    if (currentQuestionIndex === quizData.length - 1) {
      nextBtn.textContent = "結果を見る";
    } else {
      nextBtn.textContent = "次の問題へ進む";
    }
  }

  // 次の問題へ
  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
      loadQuestion();
    } else {
      showFinalScore();
    }
  }

  // 最終結果の表示
  function showFinalScore() {
    quizArea.style.display = "none";
    finalArea.style.display = "block";
    scoreText.textContent = `全 ${quizData.length} 問中、${score} 問正解でした！`;
  }

  // 最初からやり直す
  function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    finalArea.style.display = "none";
    quizArea.style.display = "block";
    loadQuestion();
  }

  // 初回読み込み
  loadQuestion();
</script>

</body>
</html>
